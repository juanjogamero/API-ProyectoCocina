name: Backend · Java 17
on:
  push:
    branches: [main, feature/proyecto-cocina-portfolio]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y ejecutar tests
        run: bash ./mvnw --batch-mode verify
