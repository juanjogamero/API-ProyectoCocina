services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proyectococina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d proyectococina"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cocina_postgres:/var/lib/postgresql/data

volumes:
  cocina_postgres:
